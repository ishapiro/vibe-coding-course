name = "test"
main = ".output/server/index.mjs"
compatibility_date = "2026-03-09"
compatibility_flags = ["nodejs_compat"]

# Create the database: npx wrangler d1 create demo-test-db
# Paste the database_id from the command output into wrangler.toml (or use a Cloudflare dashboard ID).
[[d1_databases]]
binding = "demo_test_db"
database_name = "demo-test-db"
# database_id = "6217f83d-2684-4a15-ae1f-9561c92fcabb"
database_id = "32993e03-a218-4450-8ff8-a1c3fce9b626"

[assets]
binding = "ASSETS"
directory = ".output/public"

# Custom domain on a zone you control (example):
# [[routes]]
# pattern = "vibe-test.example.com"
# custom_domain = true
